name: Build Frequency Field Native APK

on:
  push:
    branches:
      - build-frequency-field-native
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Expand native source
        run: unzip -q FrequencyField-Native-Source.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build native APK
        run: gradle -p FrequencyFieldNative --no-daemon :app:assembleDebug

      - name: Publish APK
        run: |
          cp FrequencyFieldNative/app/build/outputs/apk/debug/app-debug.apk FrequencyField-Native-debug.apk
          sha256sum FrequencyField-Native-debug.apk > FrequencyField-Native-debug.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FrequencyField-Native-debug.apk FrequencyField-Native-debug.apk.sha256
          git commit -m "Build native Frequency Field APK" || exit 0
          git push
